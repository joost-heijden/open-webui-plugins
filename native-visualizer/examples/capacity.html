<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capacity explorer</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: clamp(16px, 5vw, 36px); background: light-dark(#f5f5ff, #151522); color: light-dark(#202038, #f3f3ff); }
    main { max-width: 560px; margin: auto; }
    h1 { font-size: clamp(24px, 5vw, 36px); margin-bottom: 8px; }
    p { line-height: 1.6; }
    section { padding: 24px; border: 1px solid #8888; border-radius: 16px; margin-top: 24px; }
    label, output { display: block; margin: 12px 0; }
    input, progress { width: 100%; accent-color: #818cf8; }
    output { font-size: 28px; font-weight: 700; }
    button { font: inherit; padding: 10px 18px; border: 1px solid #888; border-radius: 8px; cursor: pointer; background: light-dark(#fff, #27273b); color: inherit; }
    :focus-visible { outline: 3px solid #818cf8; outline-offset: 4px; }
  </style>
</head>
<body>
<main>
  <h1>Capacity explorer</h1>
  <p>Fictional example: 20 requests per person per day. Adjust the team size to explore the total.</p>
  <section aria-label="Capacity calculator">
    <label for="people">Team size: <strong id="count">5</strong> people</label>
    <input id="people" type="range" min="1" max="20" value="5">
    <output id="capacity" for="people" aria-live="polite">100 requests per day</output>
    <label for="utilization">Capacity relative to a 20-person team</label>
    <progress id="utilization" max="400" value="100">25%</progress>
    <p id="formula">5 people × 20 requests = 100 requests per day.</p>
    <button id="reset" type="button">Reset</button>
  </section>
  <p>This calculator keeps no saved state and makes no network requests.</p>
</main>
<script>
  const people = document.getElementById('people');
  function update() {
    const count = Number(people.value);
    if (!Number.isInteger(count) || count < 1 || count > 20) return;
    const total = count * 20;
    document.getElementById('count').textContent = String(count);
    document.getElementById('capacity').textContent = total + ' requests per day';
    document.getElementById('utilization').value = total;
    document.getElementById('utilization').textContent = (count * 5) + '%';
    document.getElementById('formula').textContent = count + ' people × 20 requests = ' + total + ' requests per day.';
  }
  people.addEventListener('input', update);
  document.getElementById('reset').addEventListener('click', () => { people.value = '5'; update(); });
  update();
</script>
</body>
</html>
