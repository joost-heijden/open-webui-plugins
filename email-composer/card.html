<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--surface:light-dark(#fff,#202020);--text:light-dark(#202020,#ededed);--muted:light-dark(#686868,#aaa);--border:light-dark(#e5e5e5,#3b3b3b);--chip:light-dark(#efefef,#343434);--hover:light-dark(#f3f3f3,#303030);--focus:light-dark(#525252,#c4c4c4);color:var(--text);background:transparent}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:1px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button,summary{-webkit-tap-highlight-color:transparent}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}button:disabled{cursor:default}button[hidden],[hidden]{display:none!important}
.composer{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:visible}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}header strong{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650}header strong svg{width:21px;height:21px}.header-tools{display:flex;gap:8px;align-items:center}.priority-badge{font-size:11px;color:var(--muted)}details{position:relative}summary{display:flex;padding:6px;border-radius:6px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary:hover{background:var(--hover)}.options{position:absolute;z-index:2;right:0;top:36px;min-width:200px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:12px}.options label{font-size:12px;color:var(--muted)}select{display:block;width:100%;margin-top:6px;padding:6px;border:1px solid var(--border);border-radius:5px;background:var(--surface)}
.fields{margin:0 20px}.field{display:flex;align-items:center;gap:14px;min-height:47px;border-top:1px solid var(--border);padding:8px 0}.field-name{flex:0 0 64px;color:var(--muted);font-size:13px}.recipient{display:flex;align-items:center;flex-wrap:wrap;gap:5px;min-width:0;flex:1}.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;background:var(--chip);border-radius:16px;padding:3px 6px 3px 11px;font-size:12px}.chip span{overflow-wrap:anywhere;min-width:0}.chip button{display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:50%;padding:2px;color:var(--muted)}.chip button:hover{background:var(--border)}.chip svg{width:12px;height:12px}.recipient-entry{flex:1;width:100%;min-width:70px;border:0;outline:0;padding:4px 2px;background:transparent;font-size:13px}.recipient:has(.chip) .recipient-entry{flex:1 1 70px;width:70px}.recipient-entry:focus-visible{box-shadow:inset 0 -1px var(--focus)}.reveal{display:flex;gap:10px;margin-left:auto}.reveal button{background:none;border:0;padding:4px 0;color:var(--muted);font-size:12px}.reveal button:hover{color:var(--text)}#subject{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:4px 0;font-size:14px}#subject:focus-visible{box-shadow:inset 0 -1px var(--focus)}input::placeholder{color:var(--muted);opacity:.8}
nav{display:flex;align-items:center;gap:3px;border-top:1px solid var(--border);margin:0 20px;padding:9px 0 3px}nav button{display:flex;align-items:center;justify-content:center;width:31px;height:31px;border:0;border-radius:5px;padding:6px;background:transparent}nav button:hover,nav button[aria-pressed=true]{background:var(--hover)}nav button[aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--border)}.separator{height:18px;width:1px;background:var(--border);margin:0 7px}#editor{min-height:180px;padding:14px 20px 18px;overflow-wrap:anywhere;outline:none}#editor:focus-visible{box-shadow:inset 2px 0 var(--focus)}#editor:empty:before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}#editor p,#editor div{margin:0 0 14px}#editor>:last-child{margin-bottom:0}#editor ul,#editor ol{margin:0 0 14px;padding-left:24px}#editor li{margin:3px 0}#editor a{text-decoration:underline;color:inherit}#editor blockquote{border-left:2px solid var(--border);margin:0 0 14px;padding-left:14px}footer{padding:0 20px 12px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}#state{white-space:pre-wrap}footer:has(#state:empty){display:none}
@media(max-width:480px){header{padding:14px}.fields,nav{margin-inline:14px}.field{gap:8px}.field-name{flex-basis:48px}.reveal{gap:8px}#editor{padding:12px 14px 16px}footer{padding-inline:14px}.chip{font-size:11px}.recipient:has(.chip) .recipient-entry{min-width:30px;flex-basis:30px}}
</style>
</head>
<body>
<article class="composer" aria-label="Email composer">
<header><strong><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</strong><div class="header-tools"><span class="priority-badge" id="priority-badge" hidden></span><details id="options"><summary aria-label="Email options" title="Email options"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary><div class="options"><label for="priority">Priority</label><select id="priority" aria-label="Priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></div></details></div></header>
<div class="fields">
<div class="field"><label class="field-name" for="to-entry">To</label><div class="recipient" data-recipient="to"><input type="hidden" id="to"><input class="recipient-entry" id="to-entry" aria-label="To" placeholder="name@example.com" autocomplete="off" spellcheck="false"></div><div class="reveal"><button type="button" data-reveal="cc" aria-expanded="false" aria-controls="cc-row">Cc</button><button type="button" data-reveal="bcc" aria-expanded="false" aria-controls="bcc-row">Bcc</button></div></div>
<div class="field" id="cc-row" hidden><label class="field-name" for="cc-entry">Cc</label><div class="recipient" data-recipient="cc"><input type="hidden" id="cc"><input class="recipient-entry" id="cc-entry" aria-label="CC" placeholder="name@example.com" autocomplete="off" spellcheck="false"></div></div>
<div class="field" id="bcc-row" hidden><label class="field-name" for="bcc-entry">Bcc</label><div class="recipient" data-recipient="bcc"><input type="hidden" id="bcc"><input class="recipient-entry" id="bcc-entry" aria-label="BCC" placeholder="name@example.com" autocomplete="off" spellcheck="false"></div></div>
<div class="field"><label class="field-name" for="subject">Subject</label><input id="subject" aria-label="Subject" placeholder="Email subject"></div>
</div>
<nav aria-label="Text formatting">
<button type="button" data-command="bold" aria-label="Bold" title="Bold" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-width="2.4" d="M7 4h6a4 4 0 0 1 0 8H7zm0 8h7a4 4 0 0 1 0 8H7z"/></svg></button>
<button type="button" data-command="italic" aria-label="Italic" title="Italic" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h8M6 20h8M14 4l-4 16"/></svg></button>
<button type="button" data-command="underline" aria-label="Underline" title="Underline" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v7a6 6 0 0 0 12 0V4M4 21h16"/></svg></button>
<button type="button" id="link" aria-label="Insert link" title="Insert link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M16 8l2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(2 0) scale(.85 1)"/></svg></button>
<span class="separator" aria-hidden="true"></span>
<button type="button" data-command="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h12M9 12h12M9 19h12"/><circle cx="3" cy="5" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="19" r="1"/></svg></button>
<button type="button" data-command="insertOrderedList" aria-label="Numbered list" title="Numbered list" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5h11M10 12h11M10 19h11M2 3h1v4M2 7h3M2 11c0-2 3-2 3 0 0 1-3 3-3 3h3M2 17h3l-2 2c3-1 3 3-1 2"/></svg></button>
</nav>
<div id="editor" contenteditable="true" role="textbox" aria-label="Message body" aria-multiline="true" data-placeholder="Write your message…"></div>
<footer><div id="state" role="status" aria-live="polite"></div></footer>
</article>
<script>
const initial=/*INITIAL*/;
let card=initial.card,revision=initial.revision,savedHash=null,hasSaved=Boolean(initial.saved_at),outcome=initial.status;
const ids=['to','cc','bcc','subject','priority'],editor=document.getElementById('editor'),status=document.getElementById('state');
const recipients=['to','cc','bcc'];
const split=value=>value.split(/[;,]/).map(s=>s.trim()).filter(Boolean);
function recipientValue(id){return [...split(document.getElementById(id).value),...split(document.getElementById(id+'-entry').value)].join('; ');}
function fields(){return Object.fromEntries([...ids.map(id=>[id,recipients.includes(id)?recipientValue(id):document.getElementById(id).value]),['html',sanitize(editor.innerHTML)]]);}
function renderRecipients(id,value){const box=document.querySelector('[data-recipient="'+id+'"]'),entry=document.getElementById(id+'-entry'),addresses=split(value);document.getElementById(id).value=addresses.join('; ');entry.value='';entry.placeholder=addresses.length?'':'name@example.com';box.querySelectorAll('.chip').forEach(el=>el.remove());addresses.forEach(address=>{const chip=document.createElement('span');chip.className='chip';const text=document.createElement('span');text.textContent=address;const remove=document.createElement('button');remove.type='button';remove.setAttribute('aria-label','Remove '+address+' from '+id.toUpperCase());remove.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>';remove.addEventListener('mousedown',e=>e.preventDefault());remove.onclick=()=>{const current=split(recipientValue(id));current.splice([...box.querySelectorAll('.chip')].indexOf(chip),1);renderRecipients(id,current.join('; '));dirty();entry.focus();};chip.append(text,remove);box.insertBefore(chip,entry);});}
function reveal(id,focus=false){document.getElementById(id+'-row').hidden=false;const button=document.querySelector('[data-reveal="'+id+'"]');button.setAttribute('aria-expanded','true');button.hidden=true;if(focus)document.getElementById(id+'-entry').focus();}
recipients.forEach(id=>{const entry=document.getElementById(id+'-entry');const commit=()=>{renderRecipients(id,recipientValue(id));dirty();};entry.addEventListener('blur',commit);entry.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===';'||e.key===','){e.preventDefault();commit();}else if(e.key==='Backspace'&&!entry.value){const addresses=split(document.getElementById(id).value);entry.value=addresses.pop()||'';const pending=entry.value;renderRecipients(id,addresses.join('; '));entry.value=pending;dirty();}});});
document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>reveal(b.dataset.reveal,true));
function priorityBadge(){const value=document.getElementById('priority').value,badge=document.getElementById('priority-badge');badge.hidden=value==='normal';badge.textContent=value==='high'?'High priority':'Low priority';}
document.getElementById('priority').addEventListener('change',priorityBadge);
document.addEventListener('click',e=>{if(!e.target.closest('#options'))document.getElementById('options').open=false;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('options').open=false;});
function sanitize(html){const doc=new DOMParser().parseFromString(html,'text/html');const allowed=new Set(['P','DIV','BR','STRONG','B','EM','I','U','S','UL','OL','LI','BLOCKQUOTE','A']);function walk(node){if(node.nodeType===3)return node.textContent.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');if(node.nodeType!==1)return '';if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH'].includes(node.tagName))return '';const content=[...node.childNodes].map(walk).join('');if(!allowed.has(node.tagName))return content;let attr='';if(node.tagName==='A'&&/^https?:\/\//i.test(node.getAttribute('href')||''))attr=' href="'+node.getAttribute('href').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll("'",'&#x27;')+'"';const tag=node.tagName.toLowerCase();return '<'+tag+attr+'>'+content+(tag==='br'?'':'</'+tag+'>');}return [...doc.body.childNodes].map(walk).join('');}
function baseStatus(){return ['busy','unknown'].includes(outcome)?'Outcome uncertain. Have this card checked before saving again.':outcome==='sent'?'Send request accepted; delivery not confirmed.':hasSaved?'Saved to Outlook':'';}
function restore(value){hasSaved=Boolean(value.saved_at);outcome=value.status;recipients.forEach(id=>{renderRecipients(id,value.fields[id]);document.getElementById(id+'-row')?.setAttribute('hidden','');if(id!=='to'){const button=document.querySelector('[data-reveal="'+id+'"]');button.hidden=false;button.setAttribute('aria-expanded','false');if(value.fields[id])reveal(id);}});['subject','priority'].forEach(id=>document.getElementById(id).value=value.fields[id]);editor.innerHTML=sanitize(value.fields.html);revision=value.revision;savedHash=JSON.stringify(fields());priorityBadge();status.textContent=baseStatus();}
restore(initial);
function dirty(){const changed=JSON.stringify(fields())!==savedHash;status.textContent=['busy','unknown','sent'].includes(outcome)?baseStatus()+(changed?' Unsaved changes.':''):changed?'Unsaved changes':baseStatus();}
document.addEventListener('input',dirty);document.addEventListener('change',dirty);
editor.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));});
editor.addEventListener('drop',e=>e.preventDefault());
function toolbarState(){document.querySelectorAll('[data-command]').forEach(b=>b.setAttribute('aria-pressed',String(document.queryCommandState(b.dataset.command))));}
document.addEventListener('selectionchange',()=>{const selection=getSelection();if(selection?.anchorNode&&editor.contains(selection.anchorNode))toolbarState();});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{if(!editor.contains(getSelection()?.anchorNode))editor.focus();document.execCommand(b.dataset.command,false,null);toolbarState();dirty();});
// A native prompt is unavailable in sandboxed frames without allow-modals. Use an inline link form.
const linkForm=document.createElement('div');linkForm.hidden=true;linkForm.style.cssText='display:flex;gap:8px;padding:8px 20px;flex-wrap:wrap';linkForm.innerHTML='<input aria-label="Link URL" type="url" placeholder="https://example.com" required style="flex:1;min-width:100px;padding:6px;border:1px solid var(--border);border-radius:5px;background:transparent"><button id="insert-link" type="button" style="background:var(--chip);border:0;border-radius:5px;padding:5px 10px">Insert</button><button type="button" style="background:transparent;border:0;padding:5px">Cancel</button>';document.querySelector('nav').after(linkForm);
let linkRange=null;document.getElementById('link').onclick=()=>{const s=getSelection();linkRange=s?.rangeCount&&editor.contains(s.anchorNode)?s.getRangeAt(0).cloneRange():null;linkForm.hidden=false;linkForm.querySelector('input').focus();};
linkForm.querySelector('#insert-link').onclick=()=>{const url=linkForm.querySelector('input').value;if(!/^https?:\/\//i.test(url)){linkForm.querySelector('input').setCustomValidity('Use an http:// or https:// link');linkForm.reportValidity();return;}editor.focus();if(linkRange){const s=getSelection();s.removeAllRanges();s.addRange(linkRange);}document.execCommand('createLink',false,url);linkForm.hidden=true;dirty();};linkForm.querySelector('input').oninput=e=>e.target.setCustomValidity('');linkForm.querySelector('input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();linkForm.querySelector('#insert-link').click();}if(e.key==='Escape')linkForm.hidden=true;};linkForm.querySelector('button:last-child').onclick=()=>{linkForm.hidden=true;editor.focus();};
// Only the parent may supply a theme; all state transfer keeps the existing nonce protocol.
window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='email-composer:theme'&&['light','dark'].includes(e.data.theme))document.documentElement.dataset.theme=e.data.theme;});
parent.postMessage({type:'email-composer:theme-request',card},'*');
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='email-composer:request')return;const {nonce,operation,payload}=e.data;let result={ok:true};if(operation==='snapshot')result={card,revision,fields:fields()};else if(payload?.card!==card)result={error:'Card mismatch'};else if(operation==='restore')restore(payload);else if(operation==='ack'){hasSaved=Boolean(payload.saved_at);outcome=payload.status;revision=payload.revision;savedHash=JSON.stringify(payload.fields);status.textContent=payload.status==='sent'?'Send request accepted; delivery not confirmed.':JSON.stringify(fields())===savedHash?'Saved to Outlook':'Saved; newer changes are still unsaved';}else result={error:'Unknown operation'};parent.postMessage({type:'email-composer:reply',nonce,payload:result},'*');});
// Measure the card rather than a viewport-height root, so collapsed fields can shrink too.
new ResizeObserver(()=>parent.postMessage({type:'iframe:height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*')).observe(document.body);
</script>
</body>
</html>
