<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;font:14px system-ui;color:light-dark(#272632,#e9e8ee);background:light-dark(#faf9fc,#1b1b27)}*{box-sizing:border-box}body{margin:0;border:1px solid #7776;border-top:3px solid #a391e8;border-radius:12px;padding:16px}header{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px}label{display:flex;align-items:center;gap:12px;border-top:1px solid #7774;padding:10px 0}label span{width:72px;color:light-dark(#666371,#aaa7bb)}input,select{font:inherit;color:inherit;background:transparent;border:0;min-width:0;flex:1;padding:4px}select{flex:0 1 auto}nav{display:flex;gap:6px;border-block:1px solid #7774;padding:8px 0;flex-wrap:wrap}button{font:inherit;color:inherit;background:#8881;border:1px solid #8884;border-radius:5px;padding:6px 10px;cursor:pointer}#editor{min-height:210px;padding:12px 0;overflow-wrap:anywhere;outline:none}#editor:focus{box-shadow:inset 0 -2px #a391e8}footer{border-top:1px solid #7774;padding-top:12px;color:light-dark(#666371,#aaa7bb);font-size:12px;overflow-wrap:anywhere}p{margin:0 0 14px}a{color:inherit}#state{white-space:pre-wrap}
</style>
<header><strong>✉ Email</strong><select id="priority" aria-label="Priority"><option value="normal">Normal priority</option><option value="high">High priority</option><option value="low">Low priority</option></select></header>
<label><span>To</span><input id="to" aria-label="To" placeholder="name@example.com"></label>
<label><span>CC</span><input id="cc" aria-label="CC" placeholder="Optional"></label>
<label><span>BCC</span><input id="bcc" aria-label="BCC" placeholder="Optional"></label>
<label><span>Subject</span><input id="subject" aria-label="Subject" placeholder="Email subject"></label>
<nav aria-label="Text formatting"><button data-command="bold"><b>B</b></button><button data-command="italic"><i>I</i></button><button data-command="underline"><u>U</u></button><button data-command="insertUnorderedList">• List</button><button data-command="insertOrderedList">1. List</button><button id="link">Link</button><button data-command="removeFormat">Clear formatting</button></nav>
<div id="editor" contenteditable="true" role="textbox" aria-label="Message body" aria-multiline="true"></div>
<footer><div id="state" role="status" aria-live="polite"></div><div>Use Save draft or Send email in the action bar below this chat message.</div></footer>
<script>
const initial=/*INITIAL*/;
let card=initial.card,revision=initial.revision,savedHash=null,hasSaved=Boolean(initial.saved_at);
const ids=['to','cc','bcc','subject','priority'],editor=document.getElementById('editor'),status=document.getElementById('state');
function fields(){return Object.fromEntries([...ids.map(id=>[id,document.getElementById(id).value]),['html',sanitize(editor.innerHTML)]]);}
function sanitize(html){const doc=new DOMParser().parseFromString(html,'text/html');const allowed=new Set(['P','DIV','BR','STRONG','B','EM','I','U','S','UL','OL','LI','BLOCKQUOTE','A']);function walk(node){if(node.nodeType===3)return node.textContent.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');if(node.nodeType!==1)return '';if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH'].includes(node.tagName))return '';const content=[...node.childNodes].map(walk).join('');if(!allowed.has(node.tagName))return content;let attr='';if(node.tagName==='A'&&/^https?:\/\//i.test(node.getAttribute('href')||''))attr=' href="'+node.getAttribute('href').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll("'",'&#x27;')+'"';const tag=node.tagName.toLowerCase();return '<'+tag+attr+'>'+content+(tag==='br'?'':'</'+tag+'>');}return [...doc.body.childNodes].map(walk).join('');}
function restore(value){hasSaved=Boolean(value.saved_at);ids.forEach(id=>document.getElementById(id).value=value.fields[id]);editor.innerHTML=sanitize(value.fields.html);revision=value.revision;savedHash=JSON.stringify(fields());status.textContent=['busy','unknown'].includes(value.status)?'Outcome uncertain. Have this card checked before saving again.':value.status==='sent'?'Send request accepted; delivery not confirmed.':value.saved_at?'Saved: '+new Date(value.saved_at).toLocaleString():'Not yet saved to Outlook';}
restore(initial);
function dirty(){status.textContent=JSON.stringify(fields())===savedHash?(hasSaved?'Saved fields loaded':'Not yet saved to Outlook'):'Unsaved changes';}
document.addEventListener('input',dirty);document.addEventListener('change',dirty);
editor.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));});
editor.addEventListener('drop',e=>e.preventDefault());
document.querySelectorAll('[data-command]').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.onclick=()=>{document.execCommand(b.dataset.command,false,null);dirty();};});
document.getElementById('link').onclick=()=>{const url=prompt('Link (https://...)');if(url&&/^https?:\/\//i.test(url)){document.execCommand('createLink',false,url);dirty();}};
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='email-composer:request')return;const {nonce,operation,payload}=e.data;let result={ok:true};if(operation==='snapshot')result={card,revision,fields:fields()};else if(payload?.card!==card)result={error:'Card mismatch'};else if(operation==='restore')restore(payload);else if(operation==='ack'){hasSaved=Boolean(payload.saved_at);revision=payload.revision;savedHash=JSON.stringify(payload.fields);status.textContent=payload.status==='sent'?'Send request accepted; delivery not confirmed.':JSON.stringify(fields())===savedHash?'Saved to Outlook':'Saved; newer changes are still unsaved';}else result={error:'Unknown operation'};parent.postMessage({type:'email-composer:reply',nonce,payload:result},'*');});
new ResizeObserver(()=>parent.postMessage({type:'iframe:height',height:document.documentElement.scrollHeight},'*')).observe(document.body);
</script></html>
